name: Compilar Instalador Windows (.exe)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite disparar la compilación manualmente con un clic desde la web de GitHub

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias de pruebas
        run: python -m pip install -r escritorio/requirements.txt
      - name: Ejecutar regresiones
        run: python -m unittest discover -s escritorio/tests -v

  build:
    needs: tests
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Inno Setup 6
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Instalar dependencias de Python y PyInstaller
        working-directory: ./escritorio
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6,<7"

      - name: Compilar ejecutable con PyInstaller
        working-directory: ./escritorio
        run: |
          python -m PyInstaller --noconfirm --clean --windowed `
            --collect-all pypdfium2 `
            --collect-all pypdfium2_raw `
            --hidden-import PIL.Image `
            --name MateriaPrima `
            --add-data "AS-REG-018.xlsx;." `
            --add-data "ui;ui" `
            --add-data "tecnicas.json;." `
            --add-data "ejemplo;ejemplo" `
            desktop.py

      - name: Probar el ejecutable empaquetado
        working-directory: ./escritorio
        run: |
          $process = Start-Process -FilePath '.\dist\MateriaPrima\MateriaPrima.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Falló la prueba de inicio del ejecutable empaquetado (código $($process.ExitCode))." }

      - name: Compilar Instalador con Inno Setup
        working-directory: ./escritorio
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MateriaPrima.iss

      - name: Subir Instalador como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: MateriaPrima-Setup-Windows
          path: escritorio/dist/MateriaPrima-Setup.exe
          if-no-files-found: error
